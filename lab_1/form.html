<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Запропонувати місто</title>
</head>
<body>
<header>
    <h1>Запропонувати місто</h1>

    <nav>
        <a href="index.html">Головна</a>
        <a href="city-lviv.html">Львів</a>
        <a href="city-paris.html">Париж</a>
        <a href="city-tokyo.html">Токіо</a>
        <a href="form.html">Запропонувати місто</a>
    </nav>
</header>

<main>
    <section>
        <h2>Місто для наступного рейтингу</h2>

        <form>
            <p>
                <label for="name">Ваше ім’я:</label><br>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </p>

            <p>
                <label for="city">Назва міста:</label><br>
                <input
                    type="text"
                    id="city"
                    name="city"
                    required
                >
            </p>

            <p>
                <label for="country">Країна:</label><br>
                <input
                    type="text"
                    id="country"
                    name="country"
                    required
                >
            </p>

            <p>
                <label for="type">Тип пропозиції:</label><br>
                <select id="type" name="type">
                    <option value="travel">Місто для подорожі</option>
                    <option value="culture">Культурне місто</option>
                    <option value="technology">Технологічне місто</option>
                    <option value="history">Історичне місто</option>
                </select>
            </p>

            <p>
                <label for="reason">
                    Чому варто відвідати це місто?
                </label><br>
                <textarea
                    id="reason"
                    name="reason"
                    rows="6"
                    cols="40"
                    required
                ></textarea>
            </p>

            <button type="submit">Надіслати пропозицію</button>
        </form>
    </section>
</main>

<footer>
    <p>Автор: Петращук Марія</p>
    <a href="index.html">Повернутися на головну</a>
</footer>
</body>
</html>
